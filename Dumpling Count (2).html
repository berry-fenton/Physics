<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dumpling Count</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, gentle, playful; big targets and big numerals for a five-year-old
   IDEA: a bamboo dumpling steamer full of little dumpling friends at a dim sum table
   PICTURE: the steamer itself, packed with bouncing, spinning, flipping dumplings
   COLOUR and TYPE: tomato-red table, bamboo tan steamer, cream dumplings with pastel tints; Baloo 2 throughout
   LAYOUT: number bar 11-20 on top, steamer below, one line of status and two buttons */
:root{color-scheme:light;--table:#c8402f;--table2:#a8301f;--bamboo:#e2b874;--bamboo2:#c99450;--ink:#3b2414;--cream:#fff6e6;--good:#3fae5a;--gold:#ffcf3f}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:radial-gradient(900px 500px at 50% 0,#d9523f,var(--table) 60%,var(--table2));color:var(--ink);font:18px/1.4 "Baloo 2",system-ui,sans-serif;min-height:100vh;overflow-x:clip}
.wrap{max-width:1040px;margin:0 auto;padding:12px max(2.5vw,8px) 24px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--cream);margin-bottom:8px}
h1{margin:0;font-weight:800;font-size:clamp(26px,4.5vw,40px);line-height:1.05}
.stars{font-weight:800;font-size:22px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.stars svg{width:28px;height:28px}
.bar{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:clamp(4px,1vw,10px);background:var(--table2);padding:clamp(6px,1vw,10px);border-radius:20px;box-shadow:inset 0 3px 8px rgba(0,0,0,.25)}
.num{font:800 clamp(22px,4.4vw,44px)/1 "Baloo 2",sans-serif;color:var(--ink);background:var(--cream);border:0;border-radius:14px;min-height:clamp(52px,9vw,84px);cursor:pointer;box-shadow:0 5px 0 #d8c3a0;transition:transform .12s,background .2s;padding:0}
.num:active{transform:translateY(3px);box-shadow:0 2px 0 #d8c3a0}
.num.lit{background:var(--gold);box-shadow:0 5px 0 #c99a10;transform:translateY(-3px)}
.num.tried{opacity:.4}
.num.right{background:var(--good);color:#fff;box-shadow:0 5px 0 #23763a}
.num.shake{animation:shake .4s}
.num:focus-visible,.btn:focus-visible,.dump:focus-visible{outline:4px solid #fff;outline-offset:3px}
.steamer{position:relative;margin-top:12px;height:clamp(360px,62vh,640px);border-radius:28px;padding:14px;
 background:repeating-linear-gradient(90deg,var(--bamboo) 0 22px,var(--bamboo2) 22px 24px);box-shadow:0 14px 30px rgba(0,0,0,.35),inset 0 0 0 8px #b5823f}
.liner{position:absolute;inset:16px;border-radius:20px;background:radial-gradient(circle at 50% 40%,#fffaf0,#f3e3c4);overflow:hidden;
 background-image:radial-gradient(circle,rgba(180,140,80,.18) 2px,transparent 2.5px),radial-gradient(circle at 50% 40%,#fffaf0,#f3e3c4);background-size:28px 28px,100% 100%}
.dump{position:absolute;padding:0;border:0;background:none;cursor:pointer;transform:translate(-50%,-50%);-webkit-tap-highlight-color:transparent}
.dump .mv{display:block;width:100%;height:100%;animation:var(--a) var(--d) ease-in-out infinite;animation-delay:var(--dl);transform-origin:50% 70%}
.dump svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 4px 2px rgba(90,50,10,.25))}
.dump .badge{position:absolute;left:50%;top:-8%;transform:translate(-50%,-50%) scale(0);background:var(--good);color:#fff;font:800 clamp(18px,3vw,28px)/1 "Baloo 2";min-width:1.7em;height:1.7em;border-radius:1em;display:grid;place-items:center;border:3px solid #fff;transition:transform .25s cubic-bezier(.3,1.6,.5,1);pointer-events:none;z-index:2}
.dump.done .badge{transform:translate(-50%,-50%) scale(1)}
.dump.done svg{filter:drop-shadow(0 0 6px rgba(63,174,90,.9)) drop-shadow(0 4px 2px rgba(90,50,10,.25))}
.dump.nope .mv{animation:shake .4s}
.party .dump .mv{animation:jump .6s ease-in-out infinite;animation-delay:var(--dl)}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14%)}}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes flip{0%,30%{transform:rotateY(0)}70%,100%{transform:rotateY(360deg)}}
@keyframes wiggle{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(0) scale(1.1,.88)}55%{transform:translateY(-22%) scale(.95,1.06)}}
@keyframes somersault{0%,40%{transform:translateY(0) rotate(0)}70%{transform:translateY(-18%) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8%)}75%{transform:translateX(8%)}}
.status{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;color:var(--cream)}
.msg{font-weight:800;font-size:clamp(20px,3.2vw,28px);line-height:1.15;flex:1 1 280px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:800 18px "Baloo 2",sans-serif;border:0;border-radius:14px;min-height:50px;padding:0 18px;cursor:pointer;background:var(--cream);color:var(--ink);box-shadow:0 4px 0 #d8c3a0}
.btn.go{background:var(--gold);box-shadow:0 4px 0 #c99a10}
.win{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:5}
.win[hidden]{display:none}
.win div{background:rgba(255,246,230,.95);border:6px solid var(--good);border-radius:28px;padding:10px 34px 16px;text-align:center;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.win b{display:block;font-size:clamp(80px,16vw,150px);line-height:.95;color:var(--good)}
.win span{font-size:clamp(20px,3vw,28px);font-weight:800}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.conf{position:absolute;width:14px;height:14px;z-index:4;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{from{transform:translate(0,0) rotate(0)}to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
.note{color:#ffd9cf;font-size:14px;margin-top:10px}
.lvl{display:inline-flex;background:var(--table2);border-radius:14px;padding:4px;gap:4px}
.lvl button{font:800 16px "Baloo 2",sans-serif;border:0;border-radius:10px;min-height:44px;padding:0 14px;cursor:pointer;background:transparent;color:var(--cream)}
.lvl button[aria-pressed=true]{background:var(--cream);color:var(--ink)}
.hr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.task{display:flex;align-items:center;gap:10px;margin-top:10px;background:var(--cream);border-radius:18px;padding:6px 16px;font-weight:800;font-size:clamp(22px,3.6vw,32px);line-height:1.1;width:fit-content;max-width:100%}
.task[hidden]{display:none}
.task svg{width:clamp(44px,6vw,60px);height:clamp(40px,5.4vw,54px);flex:none}
.task em{font-style:normal;padding:0 .25em;border-radius:8px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
@media(max-width:600px){.steamer{padding:10px;height:clamp(360px,58vh,560px)}.liner{inset:12px}.num{border-radius:10px}}
@media(prefers-reduced-motion:reduce){.dump .mv{animation-duration:calc(var(--d)*3)!important}.party .dump .mv{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <defs>
  <g id="face"><circle cx="38" cy="58" r="5" fill="#3b2414"/><circle cx="62" cy="58" r="5" fill="#3b2414"/><circle cx="39.5" cy="56.5" r="1.7" fill="#fff"/><circle cx="63.5" cy="56.5" r="1.7" fill="#fff"/>
   <ellipse cx="29" cy="66" rx="6" ry="3.5" fill="#ff8fa3" opacity=".7"/><ellipse cx="71" cy="66" rx="6" ry="3.5" fill="#ff8fa3" opacity=".7"/>
   <path d="M44 64 Q50 70 56 64" stroke="#3b2414" stroke-width="3" fill="none" stroke-linecap="round"/></g>
  <symbol id="bao" viewBox="0 0 100 90"><path d="M8 72 Q3 40 30 26 Q50 8 70 26 Q97 40 92 72 Q50 92 8 72Z" fill="currentColor"/>
   <path d="M50 14 L42 30 M50 14 L58 30 M50 14 L33 34 M50 14 L67 34 M50 14 L50 32" stroke="rgba(120,80,40,.35)" stroke-width="2.5" stroke-linecap="round"/>
   <ellipse cx="32" cy="40" rx="10" ry="5" fill="#fff" opacity=".5" transform="rotate(-25 32 40)"/><use href="#face"/></symbol>
  <symbol id="gyoza" viewBox="0 0 100 90"><path d="M5 66 Q20 18 50 18 Q80 18 95 66 Q50 86 5 66Z" fill="currentColor"/>
   <path d="M14 46 q6-8 12-4 q6-10 12-6 q6-10 12-6 q6-10 12 6 q6-4 12 6 q6-4 12 4" stroke="rgba(120,80,40,.35)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
   <ellipse cx="30" cy="34" rx="9" ry="4" fill="#fff" opacity=".5" transform="rotate(-30 30 34)"/><use href="#face" transform="translate(0,4)"/></symbol>
  <symbol id="xlb" viewBox="0 0 100 90"><path d="M12 74 Q6 44 34 26 Q46 16 48 4 Q52 2 54 4 Q56 16 66 26 Q94 44 88 74 Q50 92 12 74Z" fill="currentColor"/>
   <path d="M51 6 Q40 20 30 36 M51 6 Q62 20 70 36 M51 6 Q46 24 42 34 M51 6 Q56 24 58 34" stroke="rgba(120,80,40,.35)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
   <ellipse cx="30" cy="44" rx="9" ry="5" fill="#fff" opacity=".5" transform="rotate(-30 30 44)"/><use href="#face" transform="translate(0,2)"/></symbol>
  <symbol id="star" viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21l1.4-7L2 9.3l7-.8z" fill="#ffcf3f" stroke="#c99a10" stroke-width="1.2"/></symbol>
 </defs>
</svg>
<div class="wrap">
 <header><div class="hr"><h1>Dumpling Count</h1><div class="lvl" id="lvl" role="group" aria-label="Level"><button data-l="1" aria-pressed="true">Level 1: All</button><button data-l="2" aria-pressed="false">Level 2: Colors</button></div></div><div class="stars" aria-label="Stars earned"><svg><use href="#star"/></svg><span id="stars">0</span></div></header>
 <nav class="bar" id="bar" aria-label="How many dumplings?"></nav>
 <div class="task" id="task" hidden><svg viewBox="0 0 100 90" id="taskIco"><use href="#bao"/></svg><span>Count the <em id="taskC">pink</em> dumplings</span></div>
 <div class="steamer"><div class="liner" id="liner"></div><div class="win" id="win" hidden><div><b id="winN">15</b><span id="winT">dumplings!</span></div></div></div>
 <div class="status"><div class="msg" id="msg" aria-live="polite">How many dumplings? Tap them to count, or tap the number.</div>
  <div class="btns"><button class="btn" id="reset">Count again</button><button class="btn" id="voice">Voice: on</button><button class="btn go" id="next">New dumplings</button></div></div>
 <p class="note">Tip for grown-ups: tapping a dumpling counts it out loud. Once the count passes 11, the matching number lights up on the bar.</p>
</div>
<script>
{
const $=id=>document.getElementById(id);
const SHAPES=['bao','gyoza','xlb'];
const TINTS=['#fff3df','#ffe0e6','#e2f5dc','#fff0b8','#e6e4ff','#ffe3c7'];
const ANIMS=[['bounce','1.1s'],['spin','2.6s'],['flip','2.2s'],['wiggle','1.3s'],['jump','1.2s'],['somersault','2.4s']];
const WORDS={11:'eleven',12:'twelve',13:'thirteen',14:'fourteen',15:'fifteen',16:'sixteen',17:'seventeen',18:'eighteen',19:'nineteen',20:'twenty'};
const rnd=n=>Math.floor(Math.random()*n),pick=a=>a[rnd(a.length)];
const COLORS=[{n:'pink',c:'#ff7fb0'},{n:'blue',c:'#4a9cff'},{n:'green',c:'#4cc35e'},{n:'yellow',c:'#ffd53a'},{n:'purple',c:'#a46bf0'},{n:'orange',c:'#ff8a2a'}];
let n=0,count=0,done=false,stars=0,voice=true,cells=[],level=1,target=null,lastColor='';
try{stars=+localStorage.getItem('dc-stars')||0}catch(e){}
$('stars').textContent=stars;

/* sound + voice */
let ac=null;
function tone(f,dur=.12,type='sine',vol=.12,delay=0){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
 const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.5,t+dur);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function say(t){if(!voice)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.85;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}}

/* number bar */
$('bar').innerHTML=Array.from({length:10},(_,i)=>'<button class="num" data-v="'+(i+11)+'" aria-label="'+(i+11)+'">'+(i+11)+'</button>').join('');
const nums=[...document.querySelectorAll('.num')];
nums.forEach(b=>b.onclick=()=>guess(+b.dataset.v,b));

/* layout */
function grid(){const L=$('liner'),w=L.clientWidth,h=L.clientHeight,r=w/h;
 const cap=level===2?30:24,cols=r>1.35?(level===2?7:6):r>.9?(level===2?6:5):(level===2?5:4),rows=Math.ceil(cap/cols);return {w,h,cols,rows}}
function place(){const g=grid(),cw=g.w/g.cols,ch=g.h/g.rows,size=Math.min(cw,ch)*.74;
 document.querySelectorAll('.dump').forEach((d,i)=>{const c=cells[i];
  d.style.left=(c.fx*100)+'%';d.style.top=(c.fy*100)+'%';d.style.width=size+'px';d.style.height=(size*.9)+'px'})}
function newRound(){
 let m;do m=11+rnd(10);while(m===n);n=m;count=0;done=false;
 const g=grid(),cap=g.cols*g.rows;
 let colors;
 if(level===2){
  do target=pick(COLORS);while(target.n===lastColor);lastColor=target.n;
  const others=COLORS.filter(c=>c!==target).sort(()=>Math.random()-.5).slice(0,n>16?2:3);
  const extra=Math.max(4,Math.min(10,cap-n-2));
  colors=Array(n).fill(target).concat(Array.from({length:extra},(_,i)=>others[i%others.length])).sort(()=>Math.random()-.5);
  $('taskC').textContent=target.n;$('taskC').style.background=target.c;$('taskIco').style.color=target.c;$('task').hidden=false;
 }else{target=null;colors=Array.from({length:n},()=>({n:'',c:pick(TINTS)}));$('task').hidden=true}
 const slots=[...Array(cap).keys()].sort(()=>Math.random()-.5).slice(0,colors.length);
 cells=slots.map((k,i)=>({col:colors[i],fx:(k%g.cols+.5+(Math.random()-.5)*.22)/g.cols,fy:(Math.floor(k/g.cols)+.55+(Math.random()-.5)*.18)/g.rows}));
 $('liner').innerHTML=cells.map((c,i)=>{const [a,d]=pick(ANIMS),lab=(c.col.n?c.col.n+' ':'')+'dumpling';
  return '<button class="dump" data-c="'+c.col.n+'" aria-label="'+lab+'" style="--a:'+a+';--d:'+d+';--dl:-'+(Math.random()*2).toFixed(2)+'s;color:'+c.col.c+'"><span class="mv"><svg viewBox="0 0 100 90"><use href="#'+pick(SHAPES)+'"/></svg></span><span class="badge"></span></button>'}).join('');
 document.querySelectorAll('.dump').forEach(d=>d.onclick=()=>tap(d));
 place();$('liner').classList.remove('party');$('win').hidden=true;
 nums.forEach(b=>b.className='num');
 if(level===2){msg('How many '+target.n+' dumplings? Tap only the '+target.n+' ones, or tap the number.');say('Count the '+target.n+' dumplings')}
 else msg('How many dumplings? Tap them to count, or tap the number.');
}
document.querySelectorAll('#lvl button').forEach(b=>b.onclick=()=>{level=+b.dataset.l;document.querySelectorAll('#lvl button').forEach(x=>x.setAttribute('aria-pressed',x===b));newRound()});
function msg(t){$('msg').textContent=t}

/* counting */
function tap(d){
 if(done)return;
 const nope=t=>{d.classList.remove('nope');void d.offsetWidth;d.classList.add('nope');tone(180,.15,'triangle',.08);msg(t)};
 if(d.classList.contains('done')){nope('Already counted that one! Find one without a number.');return}
 if(target&&d.dataset.c!==target.n){nope('That one is '+d.dataset.c+'! Only count the '+target.n+' ones.');say('That one is '+d.dataset.c);return}
 count++;d.classList.add('done');d.querySelector('.badge').textContent=count;d.setAttribute('aria-label',(target?target.n+' ':'')+'dumpling number '+count);
 tone(420+count*25,.12);say(String(count));
 nums.forEach(b=>b.classList.toggle('lit',+b.dataset.v===count));
 if(count===n)win('You counted them all!');
 else msg(count<11?'Counting… '+count:count+'! Do you see '+count+' on the bar up top? Keep going!');
}
function reset(){if(done)return;count=0;document.querySelectorAll('.dump').forEach(d=>{d.classList.remove('done');d.querySelector('.badge').textContent='';d.setAttribute('aria-label',(d.dataset.c?d.dataset.c+' ':'')+'dumpling')});
 nums.forEach(b=>b.classList.remove('lit'));msg('Start again from 1. Tap each dumpling once.')}

/* picking a number */
function guess(v,b){
 if(done)return;
 if(v===n){win('Yes! '+n+' is right!');return}
 b.classList.add('tried');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');tone(200,.2,'triangle',.08);
 say('Hmm, not '+v);msg('Not '+v+'. Try tapping each '+(target?target.n+' ':'')+'dumpling to count them!');
}

/* winning */
function win(t){
 done=true;stars++;try{localStorage.setItem('dc-stars',stars)}catch(e){}$('stars').textContent=stars;
 nums.forEach(b=>{b.classList.remove('lit');if(+b.dataset.v===n)b.classList.add('right')});
 const what=WORDS[n]+(target?' '+target.n:'')+' dumplings';
 $('liner').classList.add('party');$('winN').textContent=n;$('winT').textContent=what+'!';$('win').hidden=false;
 msg(t+' Tap “New dumplings” to play again.');
 [523,659,784,1046].forEach((f,i)=>tone(f,.2,'triangle',.12,i*.12));setTimeout(()=>say(what+'! Great job!'),500);
 const st=document.querySelector('.steamer');
 for(let i=0;i<40;i++){const c=document.createElement('span');c.className='conf';
  c.style.cssText='left:50%;top:40%;background:'+pick(['#ffcf3f','#3fae5a','#ff8fa3','#6ab7ff','#fff'])+';border-radius:'+(i%2?'50%':'3px')+';--x:'+((Math.random()-.5)*900)+'px;--y:'+((Math.random()-.3)*500)+'px;animation-delay:'+(Math.random()*.2)+'s';
  st.appendChild(c);setTimeout(()=>c.remove(),1900)}
 setTimeout(()=>{$('win').hidden=true},2600);
}

$('reset').onclick=reset;$('next').onclick=newRound;
$('voice').onclick=()=>{voice=!voice;$('voice').textContent='Voice: '+(voice?'on':'off');if(!voice)try{speechSynthesis.cancel()}catch(e){}};
const ro=new ResizeObserver(place);ro.observe($('liner'));
newRound();
}
</script>
</body>
</html>
